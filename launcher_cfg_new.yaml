      ## only if a single filter_name is matched, the filter will be applied
      ## filter name can be a dirname or a filename
      ## filter name must obey the regex format
      ## filter option:
      ### -p for precise match, -d to match dir name
      ### -a to match lower and upper case, -f to match file name , -pf for default
      ### -pf is the default option, which means match both dirname and filename
      # note: carefully use "\", in case yaml file cannot parse the filter name
      - ["-pd", "^Windows$", "^system32$", "^SysWOW64$"]
      - ["-af", "^uninst.*\\.exe$"]
